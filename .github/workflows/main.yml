name: Build Thrawn Chess Engine (Android ARM64)

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch:

jobs:
  build-android:
    name: Build Android ARM64
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Install Android NDK
        run: |
          wget -q https://dl.google.com/android/repository/android-ndk-r26d-linux.zip
          unzip -q android-ndk-r26d-linux.zip
          echo "ANDROID_NDK_HOME=$PWD/android-ndk-r26d" >> $GITHUB_ENV

      - name: Fetch and Validate NNUE File
        run: |
          mkdir -p nn
          
          # Replace this URL with your actual direct download link:
          curl -fL -o nn/thrawn-nn-2.nnue "https://github.com/Arzam18/thrawn/releases/download/v1.0.0/thrawn-nn-2.nnue"
          
          if [ ! -f "nn/thrawn-nn-2.nnue" ] || [ ! -s "nn/thrawn-nn-2.nnue" ]; then
            echo "::error:: nn/thrawn-nn-2.nnue could not be downloaded or is empty."
            exit 1
          fi

      - name: Build Binary with Make
        run: |
          TOOLCHAIN=$ANDROID_NDK_HOME/toolchains/llvm/prebuilt/linux-x86_64/bin
          
          make TARGET=android ARCH=arm64-neon \
            CXX=$TOOLCHAIN/aarch64-linux-android24-clang++

      - name: Upload Android Binary
        uses: actions/upload-artifact@v4
        with:
          name: thrawn-android-arm64
          path: build/thrawn-*
