name: Thrawn Android ARM64 NEON DotProd

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v4


      # ============================================================
      # 2. LOCATE ANDROID SDK
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          if [ -z "${ANDROID_HOME:-}" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          fi

          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo "Android SDK:"
          echo "$ANDROID_HOME"

          SDKMANAGER=""

          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"
          do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(
              find "$ANDROID_HOME/cmdline-tools" \
                -type f \
                -name sdkmanager \
                -perm -111 \
                2>/dev/null \
                | head -n 1
            )"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo
          echo "sdkmanager:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version


      # ============================================================
      # 3. ACCEPT LICENSES
      # ============================================================

      - name: Accept Android licenses
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Android licenses accepted."


      # ============================================================
      # 4. INSTALL REQUIRED ANDROID PACKAGES
      # ============================================================

      - name: Install Android NDK
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-24" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          echo
          echo "Required Android packages installed."


      # ============================================================
      # 5. CONFIGURE NDK TOOLCHAIN
      # ============================================================

      - name: Configure NDK toolchain
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"

          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"

          if [ ! -x "$CXX" ]; then
            echo "ERROR: ARM64 Android compiler not found:"
            echo "$CXX"
            exit 1
          fi

          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"
          echo "CXX=$CXX" >> "$GITHUB_ENV"

          echo
          echo "=========================================="
          echo "ANDROID NDK"
          echo "=========================================="
          echo "$NDK"

          echo
          echo "=========================================="
          echo "ARM64 COMPILER"
          echo "=========================================="

          "$CXX" --version


      # ============================================================
      # 6. VERIFY ARM64 / NEON / DOTPROD
      # ============================================================

      - name: Verify ARM64 NEON DotProd
        shell: bash
        run: |
          set -e

          echo "Checking ARM64..."

          "$CXX" \
            -march=armv8.2-a+dotprod \
            -dM \
            -E \
            -x c++ \
            /dev/null \
            | grep "__aarch64__"

          echo
          echo "Checking NEON..."

          "$CXX" \
            -march=armv8.2-a+dotprod \
            -dM \
            -E \
            -x c++ \
            /dev/null \
            | grep "__ARM_NEON"

          echo
          echo "Checking ARM DotProd..."

          "$CXX" \
            -march=armv8.2-a+dotprod \
            -dM \
            -E \
            -x c++ \
            /dev/null \
            | grep "__ARM_FEATURE_DOTPROD"

          echo
          echo "ARM64 + NEON + DOTPROD confirmed."


      # ============================================================
      # 7. DOWNLOAD OFFICIAL THRAWN NNUE
      # ============================================================

      - name: Download Thrawn NNUE
        shell: bash
        run: |
          set -e

          mkdir -p nn

          echo "Downloading Thrawn NNUE..."

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/feftywacky/thrawn-nnue/releases/tags/thrawn-nn-2" \
            -o /tmp/thrawn-release.json

          NNUE_URL="$(
            jq -r '
              .assets[]
              | select(.name | endswith(".nnue"))
              | .browser_download_url
            ' /tmp/thrawn-release.json \
            | head -n 1
          )"

          if [ -z "$NNUE_URL" ] || [ "$NNUE_URL" = "null" ]; then
            echo "ERROR: Could not find NNUE asset."
            exit 1
          fi

          echo
          echo "NNUE URL:"
          echo "$NNUE_URL"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            "$NNUE_URL" \
            -o nn/thrawn-nn-2.nnue

          if [ ! -s nn/thrawn-nn-2.nnue ]; then
            echo "ERROR: NNUE download failed."
            exit 1
          fi

          echo
          echo "NNUE downloaded:"
          ls -lh nn/thrawn-nn-2.nnue


      # ============================================================
      # 8. BUILD
      # ============================================================

      - name: Build Thrawn
        shell: bash
        run: |
          set -e

          rm -rf build

          mkdir -p build/obj

          echo
          echo "=========================================="
          echo "THRAWN ANDROID ARM64 BUILD"
          echo "=========================================="
          echo
          echo "Compiler:"
          echo "$CXX"
          echo
          echo "Target:"
          echo "Android ARM64"
          echo
          echo "CPU:"
          echo "ARMv8.2-A + DotProd"
          echo
          echo "SIMD:"
          echo "NEON"
          echo
          echo "C++ runtime:"
          echo "STATIC libc++"
          echo
          echo "NNUE:"
          echo "Embedded thrawn-nn-2"
          echo
          echo "=========================================="

          COMMON_FLAGS=(
            -std=c++17
            -O3
            -flto=auto
            -DNDEBUG
            -DRELEASE_BUILD
            -DUSE_NEON
            -march=armv8.2-a+dotprod
            -fomit-frame-pointer
            -ffunction-sections
            -fdata-sections
            -fno-strict-aliasing
            -Wall
            -Wextra
            -Wno-unused-parameter
          )

          # --------------------------------------------------------
          # Compile all Thrawn C++ sources
          # --------------------------------------------------------

          for SRC in src/*.cpp
          do
            NAME="$(basename "$SRC" .cpp)"

            OBJ="build/obj/${NAME}.o"

            echo
            echo "------------------------------------------"
            echo "COMPILING:"
            echo "$SRC"
            echo "------------------------------------------"

            "$CXX" \
              "${COMMON_FLAGS[@]}" \
              -Isrc \
              -c "$SRC" \
              -o "$OBJ"
          done


          # --------------------------------------------------------
          # Embed NNUE
          # --------------------------------------------------------

          echo
          echo "------------------------------------------"
          echo "EMBEDDING NNUE"
          echo "------------------------------------------"

          "$CXX" \
            -DNNUE_EMBED_PATH='"nn/thrawn-nn-2.nnue"' \
            -c src/nnue_embedded_data.S \
            -o build/obj/nnue_embedded_data.o


          # --------------------------------------------------------
          # LINK
          #
          # The critical change:
          #
          #   -static-libstdc++
          #
          # This makes libc++ part of the executable instead of
          # requiring libc++_shared.so on the Android device.
          # --------------------------------------------------------

          echo
          echo "------------------------------------------"
          echo "LINKING"
          echo "------------------------------------------"

          "$CXX" \
            "${COMMON_FLAGS[@]}" \
            -static-libstdc++ \
            -Wl,--gc-sections \
            -Wl,--build-id=sha1 \
            build/obj/*.o \
            -o build/thrawn-android-arm64-neon-dotprod


          chmod +x build/thrawn-android-arm64-neon-dotprod


          echo
          echo "=========================================="
          echo "BUILD SUCCESSFUL"
          echo "=========================================="

          ls -lh \
            build/thrawn-android-arm64-neon-dotprod


      # ============================================================
      # 9. VERIFY C++ RUNTIME
      #
      # This is the important test.
      # We should NOT see libc++_shared.so here.
      # ============================================================

      - name: Verify static libc++
        shell: bash
        run: |
          set -e

          BIN="build/thrawn-android-arm64-neon-dotprod"

          READ_ELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          echo
          echo "=========================================="
          echo "DYNAMIC LIBRARIES"
          echo "=========================================="

          "$READ_ELF" \
            -d "$BIN" \
            | grep NEEDED \
            || true

          echo
          echo "Checking for libc++_shared.so..."

          if "$READ_ELF" -d "$BIN" | grep -q "libc++_shared.so"; then
            echo
            echo "ERROR:"
            echo "Binary still requires libc++_shared.so."
            echo
            exit 1
          fi

          echo
          echo "SUCCESS:"
          echo "No libc++_shared.so dependency."


      # ============================================================
      # 10. VERIFY ELF ARCHITECTURE
      # ============================================================

      - name: Validate Android ELF
        shell: bash
        run: |
          set -e

          BIN="build/thrawn-android-arm64-neon-dotprod"

          READ_ELF="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          echo
          echo "=========================================="
          echo "FILE"
          echo "=========================================="

          file "$BIN"

          echo
          echo "=========================================="
          echo "ELF MACHINE"
          echo "=========================================="

          "$READ_ELF" \
            -h "$BIN" \
            | grep "Machine:"

          echo
          echo "=========================================="
          echo "INTERPRETER"
          echo "=========================================="

          "$READ_ELF" \
            -l "$BIN" \
            | grep INTERP \
            || true

          echo
          echo "=========================================="
          echo "ARM64 CHECK"
          echo "=========================================="

          file "$BIN" \
            | grep -E \
              "ARM aarch64|ARM64|aarch64"

          echo
          echo "Android ARM64 ELF validation passed."


      # ============================================================
      # 11. CHECK FOR GLIBC / HOST RUNTIME
      # ============================================================

      - name: Check runtime strings
        shell: bash
        run: |
          set -e

          BIN="build/thrawn-android-arm64-neon-dotprod"

          echo "Checking for accidental host Linux runtime..."

          if strings "$BIN" \
            | grep -Eiq \
              'GLIBC_[0-9]|GLIBCXX_|x86_64-linux'; then

            echo
            echo "WARNING: possible host runtime strings found."

            strings "$BIN" \
              | grep -Ei \
                'GLIBC_[0-9]|GLIBCXX_|x86_64-linux' \
              || true
          else
            echo "No obvious host glibc/x86 runtime strings."
          fi


      # ============================================================
      # 12. TEST UCI STARTUP ON LINUX HOST
      #
      # We cannot execute an ARM Android binary directly on the
      # Ubuntu runner, but we can make sure the ELF is valid.
      # ============================================================

      - name: Final binary information
        shell: bash
        run: |
          set -e

          BIN="build/thrawn-android-arm64-neon-dotprod"

          echo
          echo "=========================================="
          echo "FINAL ENGINE"
          echo "=========================================="

          ls -lh "$BIN"

          echo
          file "$BIN"


      # ============================================================
      # 13. CREATE ONE ZIP CONTAINING ONE FILE
      #
      # No README
      # No checksum
      # No second binary
      # ============================================================

      - name: Create single-file ZIP
        shell: bash
        run: |
          set -e

          rm -rf package

          mkdir package

          cp \
            build/thrawn-android-arm64-neon-dotprod \
            package/

          cd package

          zip -9 \
            ../thrawn-android-arm64-neon-dotprod.zip \
            thrawn-android-arm64-neon-dotprod

          cd ..

          echo
          echo "=========================================="
          echo "ZIP CONTENTS"
          echo "=========================================="

          unzip -l \
            thrawn-android-arm64-neon-dotprod.zip

          echo
          echo "=========================================="
          echo "VERIFY ZIP CONTAINS EXACTLY ONE FILE"
          echo "=========================================="

          COUNT="$(
            unzip -Z1 \
              thrawn-android-arm64-neon-dotprod.zip \
              | wc -l
          )"

          if [ "$COUNT" -ne 1 ]; then
            echo "ERROR: ZIP does not contain exactly one file."
            exit 1
          fi

          echo "ZIP contains exactly one binary."


      # ============================================================
      # 14. UPLOAD ONLY THE ZIP
      # ============================================================

      - name: Upload single ZIP
        uses: actions/upload-artifact@v4
        with:
          name: thrawn-android-arm64-neon-dotprod
          path: thrawn-android-arm64-neon-dotprod.zip
          if-no-files-found: error


      # ============================================================
      # 15. GITHUB RELEASE — ZIP ONLY
      # ============================================================

      - name: Create GitHub release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Thrawn Android ARM64 NEON DotProd #${{ github.run_number }}
          generate_release_notes: true
          files: |
            thrawn-android-arm64-neon-dotprod.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
