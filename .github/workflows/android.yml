name: Thrawn Android ARM64 NEON DotProd

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # CHECKOUT
      # ============================================================
      - name: Checkout source
        uses: actions/checkout@v4

      # ============================================================
      # ANDROID SDK
      # ============================================================
      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android NDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-24" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

      # ============================================================
      # DOWNLOAD OFFICIAL THRAWN NNUE
      # ============================================================
      - name: Download Thrawn NNUE
        shell: bash
        run: |
          set -e

          mkdir -p nn

          echo "Getting Thrawn NNUE release information..."

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/feftywacky/thrawn-nnue/releases/tags/thrawn-nn-2" \
            -o /tmp/thrawn-release.json

          NNUE_URL="$(
            jq -r '
              .assets[]
              | select(.name | endswith(".nnue"))
              | .browser_download_url
            ' /tmp/thrawn-release.json \
            | head -n 1
          )"

          if [ -z "$NNUE_URL" ] || [ "$NNUE_URL" = "null" ]; then
            echo "ERROR: Could not find NNUE asset."
            cat /tmp/thrawn-release.json
            exit 1
          fi

          echo "NNUE:"
          echo "$NNUE_URL"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            "$NNUE_URL" \
            -o nn/thrawn-nn-2.nnue

          if [ ! -s nn/thrawn-nn-2.nnue ]; then
            echo "ERROR: NNUE download failed."
            exit 1
          fi

          echo
          echo "Downloaded NNUE:"
          ls -lh nn/thrawn-nn-2.nnue

      # ============================================================
      # CONFIGURE NDK TOOLCHAIN
      # ============================================================
      - name: Configure Android toolchain
        shell: bash
        run: |
          set -e

          export NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          export TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          test -x "$TOOLCHAIN/aarch64-linux-android24-clang++"

          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

          echo "=========================================="
          echo "ANDROID NDK"
          echo "=========================================="
          echo "$NDK"

          echo
          echo "=========================================="
          echo "COMPILER"
          echo "=========================================="

          "$TOOLCHAIN/aarch64-linux-android24-clang++" \
            --version

      # ============================================================
      # VERIFY ARM64 + NEON + DOTPROD
      # ============================================================
      - name: Verify ARM compiler
        shell: bash
        run: |
          set -e

          echo "Checking ARM64..."
          "$TOOLCHAIN/aarch64-linux-android24-clang++" \
            -march=armv8.2-a+dotprod \
            -dM \
            -E \
            -x c++ \
            /dev/null \
            | grep "__aarch64__"

          echo
          echo "Checking NEON..."
          "$TOOLCHAIN/aarch64-linux-android24-clang++" \
            -march=armv8.2-a+dotprod \
            -dM \
            -E \
            -x c++ \
            /dev/null \
            | grep "__ARM_NEON"

          echo
          echo "Checking DOTPROD..."
          "$TOOLCHAIN/aarch64-linux-android24-clang++" \
            -march=armv8.2-a+dotprod \
            -dM \
            -E \
            -x c++ \
            /dev/null \
            | grep "__ARM_FEATURE_DOTPROD"

          echo
          echo "ARM64 + NEON + DOTPROD confirmed."

      # ============================================================
      # BUILD
      # ============================================================
      - name: Build Thrawn
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build/obj

          CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"

          COMMON_FLAGS="
            -std=c++17
            -O3
            -DNDEBUG
            -DRELEASE_BUILD
            -DUSE_NEON
            -march=armv8.2-a+dotprod
            -fomit-frame-pointer
            -ffunction-sections
            -fdata-sections
            -fno-strict-aliasing
            -Wall
            -Wextra
            -Wno-unused-parameter
          "

          echo "=========================================="
          echo "THRAWN ANDROID BUILD"
          echo "=========================================="
          echo "Target : ARM64"
          echo "SIMD   : NEON"
          echo "CPU    : ARMv8.2-A"
          echo "DOTPROD: enabled"
          echo "API    : Android 24"
          echo "NDK    : 27.2.12479018"
          echo "=========================================="

          # --------------------------------------------------------
          # Compile every C++ source file
          # --------------------------------------------------------

          for SRC in src/*.cpp
          do
            NAME="$(basename "$SRC" .cpp)"
            OBJ="build/obj/${NAME}.o"

            echo
            echo "------------------------------------------"
            echo "COMPILING: $SRC"
            echo "------------------------------------------"

            "$CXX" \
              $COMMON_FLAGS \
              -DNNUE_EMBED_NAME='"thrawn-nn-2"' \
              -Isrc \
              -c "$SRC" \
              -o "$OBJ"
          done

          # --------------------------------------------------------
          # Embed official NNUE
          # --------------------------------------------------------

          echo
          echo "------------------------------------------"
          echo "EMBEDDING NNUE"
          echo "------------------------------------------"

          "$CXX" \
            -DNNUE_EMBED_PATH='"nn/thrawn-nn-2.nnue"' \
            -c src/nnue_embedded_data.S \
            -o build/obj/nnue_embedded_data.o

          # --------------------------------------------------------
          # Link
          # --------------------------------------------------------

          echo
          echo "------------------------------------------"
          echo "LINKING THRAWN"
          echo "------------------------------------------"

          "$CXX" \
            $COMMON_FLAGS \
            -Wl,--gc-sections \
            -Wl,--build-id=sha1 \
            build/obj/*.o \
            -o build/thrawn-v3.2-android-arm64-neon-dotprod

          chmod +x build/thrawn-v3.2-android-arm64-neon-dotprod

          echo
          echo "=========================================="
          echo "BUILD SUCCESSFUL"
          echo "=========================================="

          ls -lh \
            build/thrawn-v3.2-android-arm64-neon-dotprod

      # ============================================================
      # ELF VALIDATION
      # ============================================================
      - name: Validate Android binary
        shell: bash
        run: |
          set -e

          BIN="build/thrawn-v3.2-android-arm64-neon-dotprod"

          echo "=========================================="
          echo "FILE"
          echo "=========================================="

          file "$BIN"

          echo
          echo "=========================================="
          echo "ELF HEADER"
          echo "=========================================="

          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h "$BIN"

          echo
          echo "=========================================="
          echo "ARCHITECTURE"
          echo "=========================================="

          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -h "$BIN" \
            | grep "Machine:"

          echo
          echo "=========================================="
          echo "DYNAMIC LIBRARIES"
          echo "=========================================="

          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -d "$BIN" \
            | grep NEEDED || true

          echo
          echo "=========================================="
          echo "ANDROID LINKER"
          echo "=========================================="

          "$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf" \
            -l "$BIN" \
            | grep INTERP || true

          echo
          echo "=========================================="
          echo "FINAL FILE CHECK"
          echo "=========================================="

          file "$BIN" | grep -E \
            "ARM aarch64|ARM64|aarch64"

          echo
          echo "Android ARM64 binary validation passed."

      # ============================================================
      # CHECK FOR ACCIDENTAL X86 / GLIBC
      # ============================================================
      - name: Check runtime dependencies
        shell: bash
        run: |
          set -e

          BIN="build/thrawn-v3.2-android-arm64-neon-dotprod"

          echo "Checking for Linux/glibc dependencies..."

          if strings "$BIN" | grep -Eiq \
            'GLIBC_[0-9]|GLIBCXX_|libstdc\+\+|libgcc_s|x86_64-linux'; then

            echo
            echo "WARNING: Possible host Linux runtime dependency detected:"
            strings "$BIN" \
              | grep -Ei \
                'GLIBC_[0-9]|GLIBCXX_|libstdc\+\+|libgcc_s|x86_64-linux' \
              || true
          else
            echo "No obvious glibc/x86 runtime strings found."
          fi

      # ============================================================
      # CHECKSUM
      # ============================================================
      - name: Generate SHA256
        shell: bash
        run: |
          set -e

          sha256sum \
            build/thrawn-v3.2-android-arm64-neon-dotprod \
            | tee build/SHA256SUMS.txt

      # ============================================================
      # PACKAGE
      # ============================================================
      - name: Package binary
        shell: bash
        run: |
          set -e

          mkdir -p package

          cp \
            build/thrawn-v3.2-android-arm64-neon-dotprod \
            package/

          cp \
            build/SHA256SUMS.txt \
            package/

          cat > package/README.txt <<'EOF'
          Thrawn Android ARM64 NEON DotProd

          Engine: Thrawn v3.2
          Target: Android ARM64
          SIMD: ARM NEON
          CPU target: ARMv8.2-A + DotProd
          Android API: 24
          NDK: 27.2.12479018

          The official thrawn-nn-2 NNUE network is embedded
          into the executable.
          EOF

          cd package

          zip -9 \
            ../build/thrawn-v3.2-android-arm64-neon-dotprod.zip \
            *

      # ============================================================
      # ARTIFACT
      # ============================================================
      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: thrawn-android-arm64-neon-dotprod
          path: |
            build/thrawn-v3.2-android-arm64-neon-dotprod
            build/thrawn-v3.2-android-arm64-neon-dotprod.zip
            build/SHA256SUMS.txt

      # ============================================================
      # AUTO RELEASE
      # ============================================================
      - name: Create GitHub release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-v3.2-${{ github.run_number }}
          name: Thrawn v3.2 Android ARM64 NEON DotProd #${{ github.run_number }}
          generate_release_notes: true
          files: |
            build/thrawn-v3.2-android-arm64-neon-dotprod
            build/thrawn-v3.2-android-arm64-neon-dotprod.zip
            build/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
