name: Thrawn Android ARM64 NEON DotProd

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04

    steps:

      # ============================================================
      # 1. CHECKOUT
      # ============================================================

      - name: Checkout source
        uses: actions/checkout@v4


      # ============================================================
      # 2. FIND ANDROID SDK
      #
      # Do NOT use android-actions/setup-android.
      # GitHub's Ubuntu runner already contains the Android SDK.
      # ============================================================

      - name: Locate Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          if [ -z "${ANDROID_HOME:-}" ]; then
            export ANDROID_HOME="/usr/local/lib/android/sdk"
          fi

          export ANDROID_SDK_ROOT="$ANDROID_HOME"

          echo "ANDROID_HOME=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_SDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"

          echo
          echo "Searching for sdkmanager..."

          SDKMANAGER=""

          for candidate in \
            "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" \
            "$ANDROID_HOME/cmdline-tools/*/bin/sdkmanager" \
            "$ANDROID_HOME/tools/bin/sdkmanager"
          do
            if [ -x "$candidate" ]; then
              SDKMANAGER="$candidate"
              break
            fi
          done

          if [ -z "$SDKMANAGER" ]; then
            SDKMANAGER="$(find "$ANDROID_HOME/cmdline-tools" \
              -type f \
              -name sdkmanager \
              -perm -111 \
              2>/dev/null | head -n 1 || true)"
          fi

          if [ -z "$SDKMANAGER" ]; then
            echo "ERROR: sdkmanager not found."
            find "$ANDROID_HOME" \
              -maxdepth 5 \
              -type f \
              -name sdkmanager \
              2>/dev/null || true
            exit 1
          fi

          echo "SDKMANAGER=$SDKMANAGER" >> "$GITHUB_ENV"

          echo
          echo "Using:"
          echo "$SDKMANAGER"

          "$SDKMANAGER" --version


      # ============================================================
      # 3. ACCEPT ANDROID LICENSES
      # ============================================================

      - name: Accept Android licenses
        shell: bash
        run: |
          set -e

          yes | "$SDKMANAGER" --licenses >/dev/null 2>&1 || true

          echo "Android SDK licenses accepted."


      # ============================================================
      # 4. INSTALL ONLY REQUIRED PACKAGES
      #
      # IMPORTANT:
      # We deliberately DO NOT install:
      #
      #   tools
      #
      # because that package no longer exists.
      # ============================================================

      - name: Install Android NDK and platform
        shell: bash
        run: |
          set -e

          "$SDKMANAGER" \
            "platform-tools" \
            "platforms;android-24" \
            "build-tools;35.0.0" \
            "ndk;27.2.12479018"

          echo
          echo "Android packages installed."


      # ============================================================
      # 5. VERIFY NDK
      # ============================================================

      - name: Verify NDK
        shell: bash
        run: |
          set -e

          NDK="$ANDROID_SDK_ROOT/ndk/27.2.12479018"
          TOOLCHAIN="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin"

          if [ ! -d "$NDK" ]; then
            echo "ERROR: NDK directory does not exist:"
            echo "$NDK"
            exit 1
          fi

          if [ ! -x "$TOOLCHAIN/aarch64-linux-android24-clang++" ]; then
            echo "ERROR: Android ARM64 compiler not found."
            exit 1
          fi

          echo "NDK=$NDK" >> "$GITHUB_ENV"
          echo "TOOLCHAIN=$TOOLCHAIN" >> "$GITHUB_ENV"

          echo
          echo "=========================================="
          echo "NDK"
          echo "=========================================="
          echo "$NDK"

          echo
          echo "=========================================="
          echo "ARM64 COMPILER"
          echo "=========================================="

          "$TOOLCHAIN/aarch64-linux-android24-clang++" \
            --version


      # ============================================================
      # 6. VERIFY ARM64 / NEON / DOTPROD
      # ============================================================

      - name: Verify ARM64 NEON DotProd
        shell: bash
        run: |
          set -e

          CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"

          echo "Testing ARM64..."

          "$CXX" \
            -march=armv8.2-a+dotprod \
            -dM \
            -E \
            -x c++ \
            /dev/null \
            | grep "__aarch64__"

          echo
          echo "Testing NEON..."

          "$CXX" \
            -march=armv8.2-a+dotprod \
            -dM \
            -E \
            -x c++ \
            /dev/null \
            | grep "__ARM_NEON"

          echo
          echo "Testing DOTPROD..."

          "$CXX" \
            -march=armv8.2-a+dotprod \
            -dM \
            -E \
            -x c++ \
            /dev/null \
            | grep "__ARM_FEATURE_DOTPROD"

          echo
          echo "=========================================="
          echo "ARM64 + NEON + DOTPROD OK"
          echo "=========================================="


      # ============================================================
      # 7. DOWNLOAD OFFICIAL THRAWN NNUE
      # ============================================================

      - name: Download Thrawn NNUE
        shell: bash
        run: |
          set -e

          mkdir -p nn

          echo "Downloading official Thrawn NNUE..."

          curl -fsSL \
            -H "Accept: application/vnd.github+json" \
            "https://api.github.com/repos/feftywacky/thrawn-nnue/releases/tags/thrawn-nn-2" \
            -o /tmp/thrawn-release.json

          NNUE_URL="$(
            jq -r '
              .assets[]
              | select(.name | endswith(".nnue"))
              | .browser_download_url
            ' /tmp/thrawn-release.json \
            | head -n 1
          )"

          if [ -z "$NNUE_URL" ] || [ "$NNUE_URL" = "null" ]; then
            echo "ERROR: No NNUE asset found."
            cat /tmp/thrawn-release.json
            exit 1
          fi

          echo
          echo "NNUE URL:"
          echo "$NNUE_URL"

          curl -fL \
            --retry 5 \
            --retry-delay 2 \
            "$NNUE_URL" \
            -o nn/thrawn-nn-2.nnue

          if [ ! -s nn/thrawn-nn-2.nnue ]; then
            echo "ERROR: NNUE file is empty."
            exit 1
          fi

          echo
          echo "NNUE successfully downloaded:"
          ls -lh nn/thrawn-nn-2.nnue


      # ============================================================
      # 8. SHOW THRAWN SOURCE STRUCTURE
      # ============================================================

      - name: Inspect Thrawn source
        shell: bash
        run: |
          set -e

          echo "=========================================="
          echo "SOURCE FILES"
          echo "=========================================="

          find src -maxdepth 1 -type f \
            | sort

          echo
          echo "=========================================="
          echo "MAKEFILE ARCHITECTURE TARGETS"
          echo "=========================================="

          grep -n \
            -E "arm64|neon|dotprod|USE_NEON" \
            Makefile \
            || true


      # ============================================================
      # 9. BUILD
      # ============================================================

      - name: Build Thrawn Android ARM64
        shell: bash
        run: |
          set -e

          rm -rf build
          mkdir -p build/obj

          CXX="$TOOLCHAIN/aarch64-linux-android24-clang++"

          echo "=========================================="
          echo "THRAWN ANDROID ARM64 BUILD"
          echo "=========================================="
          echo
          echo "Compiler:"
          echo "$CXX"
          echo
          echo "Architecture:"
          echo "ARM64 / AArch64"
          echo
          echo "SIMD:"
          echo "NEON + DotProd"
          echo
          echo "Target:"
          echo "ARMv8.2-A + DotProd"
          echo
          echo "Android API:"
          echo "24"
          echo
          echo "NDK:"
          echo "27.2.12479018"
          echo "=========================================="

          COMMON_FLAGS=(
            -std=c++17
            -O3
            -DNDEBUG
            -DUSE_NEON
            -march=armv8.2-a+dotprod
            -fomit-frame-pointer
            -ffunction-sections
            -fdata-sections
            -fno-strict-aliasing
            -Wall
            -Wextra
            -Wno-unused-parameter
          )

          # --------------------------------------------------------
          # Compile C++ sources
          # --------------------------------------------------------

          for SRC in src/*.cpp
          do
            NAME="$(basename "$SRC" .cpp)"
            OBJ="build/obj/${NAME}.o"

            echo
            echo "------------------------------------------"
            echo "COMPILING"
            echo "$SRC"
            echo "------------------------------------------"

            "$CXX" \
              "${COMMON_FLAGS[@]}" \
              -Isrc \
              -c "$SRC" \
              -o "$OBJ"
          done

          # --------------------------------------------------------
          # Embed NNUE
          # --------------------------------------------------------

          echo
          echo "------------------------------------------"
          echo "COMPILING EMBEDDED NNUE"
          echo "------------------------------------------"

          "$CXX" \
            -DNNUE_EMBED_PATH='"nn/thrawn-nn-2.nnue"' \
            -c src/nnue_embedded_data.S \
            -o build/obj/nnue_embedded_data.o

          # --------------------------------------------------------
          # LINK
          # --------------------------------------------------------

          echo
          echo "------------------------------------------"
          echo "LINKING"
          echo "------------------------------------------"

          "$CXX" \
            "${COMMON_FLAGS[@]}" \
            -Wl,--gc-sections \
            -Wl,--build-id=sha1 \
            build/obj/*.o \
            -o build/thrawn-android-arm64-neon-dotprod

          chmod +x build/thrawn-android-arm64-neon-dotprod

          echo
          echo "=========================================="
          echo "BUILD SUCCESSFUL"
          echo "=========================================="

          ls -lh \
            build/thrawn-android-arm64-neon-dotprod


      # ============================================================
      # 10. ELF VALIDATION
      # ============================================================

      - name: Validate binary
        shell: bash
        run: |
          set -e

          BIN="build/thrawn-android-arm64-neon-dotprod"

          LLVM_READelf="$NDK/toolchains/llvm/prebuilt/linux-x86_64/bin/llvm-readelf"

          echo "=========================================="
          echo "FILE"
          echo "=========================================="

          file "$BIN"

          echo
          echo "=========================================="
          echo "ELF MACHINE"
          echo "=========================================="

          "$LLVM_READelf" \
            -h "$BIN" \
            | grep "Machine:"

          echo
          echo "=========================================="
          echo "DYNAMIC DEPENDENCIES"
          echo "=========================================="

          "$LLVM_READelf" \
            -d "$BIN" \
            | grep NEEDED || true

          echo
          echo "=========================================="
          echo "INTERPRETER"
          echo "=========================================="

          "$LLVM_READelf" \
            -l "$BIN" \
            | grep INTERP || true

          echo
          echo "=========================================="
          echo "ARM64 CHECK"
          echo "=========================================="

          file "$BIN" \
            | grep -E \
              "ARM aarch64|ARM64|aarch64"

          echo
          echo "Binary validation passed."


      # ============================================================
      # 11. CHECK FOR HOST LINUX DEPENDENCIES
      # ============================================================

      - name: Check runtime dependencies
        shell: bash
        run: |
          set -e

          BIN="build/thrawn-android-arm64-neon-dotprod"

          echo "Checking for obvious host Linux dependencies..."

          if strings "$BIN" \
            | grep -Eiq \
              'GLIBC_[0-9]|GLIBCXX_|x86_64-linux|libstdc\+\+|libgcc_s'; then

            echo
            echo "WARNING:"
            echo "Possible host Linux dependency detected."

            strings "$BIN" \
              | grep -Ei \
                'GLIBC_[0-9]|GLIBCXX_|x86_64-linux|libstdc\+\+|libgcc_s' \
              || true
          else
            echo "No obvious glibc/x86 runtime dependency detected."
          fi


      # ============================================================
      # 12. CHECKSUM
      # ============================================================

      - name: Generate SHA256
        shell: bash
        run: |
          set -e

          sha256sum \
            build/thrawn-android-arm64-neon-dotprod \
            | tee build/SHA256SUMS.txt


      # ============================================================
      # 13. PACKAGE
      # ============================================================

      - name: Package engine
        shell: bash
        run: |
          set -e

          mkdir -p package

          cp \
            build/thrawn-android-arm64-neon-dotprod \
            package/

          cp \
            build/SHA256SUMS.txt \
            package/

          cat > package/README.txt <<'EOF'
          Thrawn Android ARM64 NEON DotProd

          Engine: Thrawn
          Platform: Android
          Architecture: ARM64 / AArch64
          SIMD: ARM NEON
          CPU target: ARMv8.2-A + DotProd
          Android API: 24
          NDK: 27.2.12479018

          The official Thrawn NNUE network is embedded
          into the executable.
          EOF

          cd package

          zip -9 \
            ../build/thrawn-android-arm64-neon-dotprod.zip \
            *


      # ============================================================
      # 14. UPLOAD ARTIFACT
      # ============================================================

      - name: Upload Android engine
        uses: actions/upload-artifact@v4
        with:
          name: thrawn-android-arm64-neon-dotprod
          path: |
            build/thrawn-android-arm64-neon-dotprod
            build/thrawn-android-arm64-neon-dotprod.zip
            build/SHA256SUMS.txt


      # ============================================================
      # 15. AUTO RELEASE
      # ============================================================

      - name: Create GitHub release
        if: success()
        uses: softprops/action-gh-release@v2
        with:
          tag_name: android-${{ github.run_number }}
          name: Thrawn Android ARM64 NEON DotProd #${{ github.run_number }}
          generate_release_notes: true
          files: |
            build/thrawn-android-arm64-neon-dotprod
            build/thrawn-android-arm64-neon-dotprod.zip
            build/SHA256SUMS.txt
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
